<%@ Page Language="C#" AutoEventWireup="true"
    CodeBehind="RegisterStudent.aspx.cs"
    Inherits="Student_Information_Management_System.HOP.RegisterStudent" %>

<!DOCTYPE html>
<html>
<head runat="server">
    <title>Register Student</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>

<body class="bg-light">
    <form id="form1" runat="server">

        <nav class="navbar navbar-dark bg-primary px-4">
            <span class="navbar-brand">SIMS - Register Student</span>
            <a href="AdminDashboard.aspx" class="btn btn-light btn-sm">Back to Dashboard</a>
        </nav>

        <div class="container mt-4">

            <div class="card shadow-sm">
                <div class="card-header bg-dark text-white">Student Registration</div>

                <div class="card-body row g-3">

                    <div class="col-md-4">
                        <label>Username</label>
                        <asp:TextBox ID="txtUsername" runat="server" CssClass="form-control" />
                    </div>

                    <div class="col-md-4">
                        <label>Password</label>
                        <asp:TextBox ID="txtPassword" runat="server" CssClass="form-control" TextMode="Password" />
                    </div>

                    <div class="col-md-4">
                        <label>Email</label>
                        <asp:TextBox ID="txtEmail" runat="server" CssClass="form-control" TextMode="Email" />
                    </div>

                    <div class="col-md-6">
                        <label>Full Name</label>
                        <asp:TextBox ID="txtFullName" runat="server" CssClass="form-control" />
                    </div>

                    <div class="col-md-3">
                        <label>Matric Number</label>
                        <asp:TextBox ID="txtMatricNumber" runat="server" CssClass="form-control" />
                    </div>

                    <div class="col-md-3">
                        <label>Date of Birth</label>
                        <asp:TextBox ID="txtDOB" runat="server" CssClass="form-control" TextMode="Date" />
                    </div>

                    <div class="col-md-6">
                        <label>Programme</label>
                        <asp:DropDownList ID="ddlProgramme" runat="server" CssClass="form-select"></asp:DropDownList>
                    </div>

                    <div class="col-md-3">
                        <label>Status</label>
                        <asp:DropDownList ID="ddlStatus" runat="server" CssClass="form-select">
                            <asp:ListItem Text="Active" Value="Active" />
                            <asp:ListItem Text="Inactive" Value="Inactive" />
                        </asp:DropDownList>
                    </div>

                    <div class="col-12">
                        <asp:Button ID="btnRegister" runat="server"
                                    Text="Register Student"
                                    CssClass="btn btn-success"
                                    OnClick="btnRegister_Click" />

                        <asp:Button ID="btnClear" runat="server"
                                    Text="Clear"
                                    CssClass="btn btn-secondary"
                                    OnClick="btnClear_Click" />
                    </div>

                    <div class="col-12">
                        <asp:Label ID="lblMessage" runat="server" CssClass="fw-bold"></asp:Label>
                    </div>

                </div>
            </div>

            <div class="card mt-4 shadow-sm">
                <div class="card-header bg-primary text-white">Registered Students</div>
                <div class="card-body">
                    <asp:GridView ID="gvStudents" runat="server"
                                  CssClass="table table-bordered table-hover"
                                  AutoGenerateColumns="true"
                                  GridLines="None">
                    </asp:GridView>
                </div>
            </div>

        </div>

    </form>
</body>
</html>
